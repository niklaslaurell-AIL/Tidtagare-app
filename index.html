<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidtagare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="timer-container">
        <h1>Arbetstid Tidtagare</h1>
        
        <div class="user-info">
            <input type="email" id="emailInput" placeholder="Din e-postadress" class="input-field">
            
            <div class="selectors">
                <label for="typeSelect" style="font-size: 0.8em; color: #666; text-align: left; width: 100%; margin-left: 5%;">Typ av arbete:</label>
                <select id="typeSelect" class="input-field">
                    <option value="Interntid grundare">Interntid grundare</option>
                    <option value="Interntid debiterbar (sådant som är beordrat)">Interntid debiterbar</option>
                    <option value="Externtid (som debiteras)">Externtid (debiteras)</option>
                </select>
                
                <label for="categorySelect" style="font-size: 0.8em; color: #666; text-align: left; width: 100%; margin-left: 5%;">Sysselsättning:</label>
                <select id="categorySelect" class="input-field">
                    <option value="Administration">Administration</option>
                    <option value="Bygge interna vertyg">Bygge interna verktyg</option>
                    <option value="Sälj">Sälj</option>
                    <option value="Internmöte">Internmöte</option>
                    <option value="Teknisk utveckling">Teknisk utveckling</option>
                </select>
            </div>
        </div>

        <div id="display" class="timer-display">00:00:00</div>
        <div class="controls">
            <button id="startButton">Start</button>
            <button id="pauseButton">Paus</button>
            <button id="stopButton">Stopp</button>
        </div>
        <p id="recordedTime" class="recorded-time"></p>
        <button id="reportButton" style="display: none;">Öppna Rapport</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
